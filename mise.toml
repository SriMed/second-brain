[tools]
node = "24.18.1"

[tasks.install]
run = "npm ci"

[tasks.dev]
run = "npm run dev"

[tasks.build]
run = "npm run build"

[tasks.lint]
run = "npm run lint"

[tasks."lint:fix"]
run = "npm run lint:fix"

[tasks.format]
run = "npm run format"

[tasks."format:check"]
run = "npm run format:check"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.check]
run = "npm run check"
